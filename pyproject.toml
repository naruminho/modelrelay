[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelrelay"
version = "0.1.0"
description = "One small API to call LLMs anywhere: OpenAI-compatible APIs or job-queue gateways, with pluggable auth."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "naruminho" }]
dependencies = [
    "httpx>=0.27",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
modelrelay = "modelrelay.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/naruminho/modelrelay"

[tool.hatch.build.targets.wheel]
packages = ["src/modelrelay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
