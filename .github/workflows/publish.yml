# Publica no PyPI ao criar uma release no GitHub (tag vX.Y.Z, igual à version do pyproject.toml), ou à mão:
# Actions > publish > Run workflow com "publicar" marcado (a versão publicada é a do pyproject.toml da main).
# Pré-requisito (uma vez): em pypi.org > Your account > Publishing, adicionar um "pending publisher" para o projeto
# modelrelay: dono naruminho, repositório modelrelay, workflow publish.yml, ambiente "pypi".
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar no PyPI (sem marcar, só testa o build)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e ".[dev]" && python -m pytest -q
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    if: github.event_name == 'release' || inputs.publicar  # disparo manual sem "publicar" só testa o build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
